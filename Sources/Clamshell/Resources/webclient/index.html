<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clamshell</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
  #canvas{width:100%;height:100%;display:block;background:#000;object-fit:contain;outline:none}
  #vncFallback{position:fixed;inset:0;width:100%;height:100%;border:0;display:none;background:#000;z-index:1}
  #vncFallback.show{display:block}
  #banners{position:fixed;top:8px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;z-index:10}
  .banner{background:rgba(0,0,0,.78);color:#fff;padding:8px 14px;border-radius:10px;font-size:13px;display:none;text-align:center}
  .banner.show{display:block}
  #lockBanner{border:1px solid rgba(255,220,0,.7)}
  #quality{position:fixed;top:8px;right:8px;z-index:10}
  #qualityDot{width:10px;height:10px;border-radius:50%;background:#666;display:none;box-shadow:0 0 0 1px rgba(255,255,255,.2)}
  #hoverMenu{position:fixed;top:0;right:0;width:220px;height:90px;z-index:20}
  #hoverPanel{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.75);border-radius:10px;padding:8px;
    display:flex;flex-direction:column;gap:6px;opacity:0;pointer-events:none;transition:opacity .15s}
  #hoverMenu:hover #hoverPanel{opacity:1;pointer-events:auto}
  #hoverPanel a{color:#fff;text-decoration:none;font-size:13px;padding:4px 8px;border-radius:6px;white-space:nowrap}
  #hoverPanel a:hover{background:rgba(255,255,255,.15)}
  #status{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#999;font-size:14px;z-index:5;pointer-events:none}
</style>
</head>
<body>
<canvas id="canvas" tabindex="0"></canvas>
<iframe id="vncFallback" tabindex="-1"></iframe>
<div id="status">Connecting…</div>
<div id="banners">
  <div id="swBanner" class="banner">Software encoding — expect higher CPU/battery use and possibly worse latency</div>
  <div id="lockBanner" class="banner">Mac is locked — showing browser VNC fallback for login</div>
  <div id="lockBannerNoTunnel" class="banner">Mac is locked — native video paused. VNC fallback isn't reachable over this tunnel; connect over LAN to log in.</div>
  <div id="errBanner" class="banner"></div>
</div>
<div id="quality"><span id="qualityDot"></span></div>
<div id="hoverMenu"><div id="hoverPanel"></div></div>
<script type="module" src="/client/client.js"></script>
</body>
</html>
