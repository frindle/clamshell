<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clamshell</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
  #canvas{width:100%;height:100%;display:block;background:#000;object-fit:contain;outline:none;touch-action:none;transition:opacity .2s}
  #canvas.stale{opacity:.35}
  #vncFallback{position:fixed;inset:0;width:100%;height:100%;border:0;display:none;background:#000;z-index:1}
  #vncFallback.show{display:block}
  #banners{position:fixed;top:8px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;z-index:10}
  .banner{background:rgba(0,0,0,.78);color:#fff;padding:8px 14px;border-radius:10px;font-size:13px;display:none;text-align:center}
  .banner.show{display:block}
  #lockBanner{border:1px solid rgba(255,220,0,.7)}
  /* The menu opens from the small dot only. It used to be an invisible
     220x90 box that swallowed clicks on the right end of the Mac's menu bar. */
  #hoverMenu{position:fixed;top:4px;right:4px;width:22px;height:22px;z-index:20}
  #qualityDot{position:absolute;top:6px;right:6px;width:10px;height:10px;border-radius:50%;background:#666;
    border:0;padding:0;opacity:.6;box-shadow:0 0 0 1px rgba(255,255,255,.25);cursor:pointer}
  #hoverPanel{position:absolute;top:0;right:0;background:rgba(0,0,0,.8);border-radius:10px;padding:8px;min-width:170px;
    display:flex;flex-direction:column;gap:4px;opacity:0;pointer-events:none;transition:opacity .15s}
  #hoverMenu:hover #hoverPanel,#hoverMenu.open #hoverPanel{opacity:1;pointer-events:auto}
  #hoverPanel a,#hoverPanel button{color:#fff;text-decoration:none;font:inherit;font-size:13px;padding:5px 8px;border-radius:6px;
    white-space:nowrap;background:none;border:0;text-align:left;cursor:pointer}
  #hoverPanel a:hover,#hoverPanel button:hover{background:rgba(255,255,255,.15)}
  #stats{color:#aaa;font-size:11px;padding:4px 8px 2px;border-top:1px solid rgba(255,255,255,.15);margin-top:2px;white-space:nowrap}
  #status{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:5;pointer-events:none}
  #statusText{background:rgba(0,0,0,.7);color:#ddd;font-size:14px;padding:10px 16px;border-radius:10px}
</style>
</head>
<body>
<canvas id="canvas" tabindex="0"></canvas>
<iframe id="vncFallback" tabindex="-1"></iframe>
<div id="status"><span id="statusText">Connecting…</span></div>
<div id="banners">
  <div id="swBanner" class="banner">Software encoding — expect higher CPU/battery use and possibly worse latency</div>
  <div id="lockBanner" class="banner">Mac is locked — showing browser VNC fallback for login</div>
  <div id="errBanner" class="banner"></div>
</div>
<div id="hoverMenu">
  <button id="qualityDot" aria-label="Clamshell menu"></button>
  <div id="hoverPanel">
    <button id="ctrlBtn">Ctrl acts as ⌘</button>
    <button id="fullscreenBtn">Full screen</button>
    <button id="soundBtn" hidden>Sound: off</button>
    <div id="stats">Not connected</div>
  </div>
</div>
<script type="module" src="/client/client.js"></script>
</body>
</html>
