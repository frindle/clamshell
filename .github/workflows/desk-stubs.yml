name: DeskStubs
on:
  push:
    branches: [main]
    paths: ['DeskStubs/**', '.github/workflows/desk-stubs.yml']
  pull_request:
    paths: ['DeskStubs/**', '.github/workflows/desk-stubs.yml']

jobs:
  # The logic and the file writer need no Apple frameworks.
  linux:
    name: DeskStubs (Linux)
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - name: Test
        working-directory: DeskStubs
        run: swift test
  # Real bundles: generate, lint the plist, sign ad hoc, verify, and run the launcher against a fake client.
  macos:
    name: DeskStubs (macOS, real bundles)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test
        working-directory: DeskStubs
        run: swift test
      - name: Generate stubs
        working-directory: DeskStubs
        run: |
          swift build -c release
          ICON=/System/Applications/Calculator.app/Contents/Resources/AppIcon.icns
          test -f "$ICON" || ICON=$(find /System/Applications -name AppIcon.icns | head -1)
          cat > "$RUNNER_TEMP/apps.json" <<JSON
          [
            {"bundleId": "org.example.heavy", "name": "Heavy App", "version": "1.2", "icon": "$ICON", "mode": "anywhere"},
            {"bundleId": "org.example.homed", "name": "Homed App", "mode": "home", "home": "other-mac"},
            {"bundleId": "org.example.here", "name": "Here App", "mode": "home", "home": "this-mac"},
            {"bundleId": "org.example.local", "name": "Local App", "mode": "local"}
          ]
          JSON
          .build/release/desk-stubgen --out "$RUNNER_TEMP/Desk" --mac this-mac --desk /usr/local/bin/desk "$RUNNER_TEMP/apps.json"
          ls "$RUNNER_TEMP/Desk"
          test -d "$RUNNER_TEMP/Desk/Heavy App.app"
          test -d "$RUNNER_TEMP/Desk/Homed App.app"
          test ! -e "$RUNNER_TEMP/Desk/Here App.app"
          test ! -e "$RUNNER_TEMP/Desk/Local App.app"
          # A second run changes nothing.
          .build/release/desk-stubgen --out "$RUNNER_TEMP/Desk" --mac this-mac --desk /usr/local/bin/desk --dry-run "$RUNNER_TEMP/apps.json" | tee "$RUNNER_TEMP/second.txt"
          test ! -s "$RUNNER_TEMP/second.txt"
      - name: Lint plists, sign, verify
        run: |
          for app in "$RUNNER_TEMP"/Desk/*.app; do
            plutil -lint "$app/Contents/Info.plist"
            sh -n "$app/Contents/MacOS/desk-stub"
            codesign --force --sign - "$app"
            codesign --verify --strict --verbose=2 "$app"
          done
          # The icon is a real icns the system can read.
          sips -g format "$RUNNER_TEMP/Desk/Heavy App.app/Contents/Resources/AppIcon.icns"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$RUNNER_TEMP/Desk/Heavy App.app/Contents/Info.plist")" = "local.desk.stub.org.example.heavy"
      - name: Launcher hands over to the Desk client
        run: |
          printf '#!/bin/sh\necho "$@" > "$RUNNER_TEMP/fake-desk.out"\n' > "$RUNNER_TEMP/fake-desk"
          chmod +x "$RUNNER_TEMP/fake-desk"
          DESK_BIN="$RUNNER_TEMP/fake-desk" "$RUNNER_TEMP/Desk/Heavy App.app/Contents/MacOS/desk-stub" extra
          test "$(cat "$RUNNER_TEMP/fake-desk.out")" = "stub-run --bundle-id org.example.heavy extra"
