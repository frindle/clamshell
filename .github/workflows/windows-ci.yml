name: Windows CI
on:
  push:
  pull_request:

# One run per branch or PR at a time; a newer push cancels the older run.
concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Pushes to this repo's own branches run on our own Windows VM (label
    # clamshell-win). The push run already covers PRs from this repo's branches,
    # so those skip. PRs from forks never touch the VM: they run on GitHub's
    # windows-latest instead.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ${{ github.event_name == 'push' && fromJSON('["self-hosted","Windows","X64","clamshell-win"]') || 'windows-latest' }}
    steps:
      # On our VM the desktop tests need the VM's own screen. While someone is
      # signed in over Remote Desktop they would fail, so wait (up to 60 min)
      # until that session is handed back to the console.
      - name: Wait while the VM is in a Remote Desktop session
        if: runner.environment == 'self-hosted'
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms
          $deadline = (Get-Date).AddMinutes(60)
          while ([System.Windows.Forms.SystemInformation]::TerminalServerSession) {
            if ((Get-Date) -gt $deadline) { throw "still in a Remote Desktop session after 60 minutes" }
            Start-Sleep -Seconds 30
          }
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      # The clip steps in the script call ffmpeg from PATH. Our VM has it
      # installed; windows-latest doesn't, but has chocolatey. Chocolatey's feed
      # sometimes times out and choco still exits 0, so try 3 times and fail
      # here if ffmpeg is still missing: ci-auto-retry.yml re-runs a failed
      # install step, but not a failed check.
      - name: Install ffmpeg if missing
        shell: pwsh
        run: |
          for ($i = 1; $i -le 3 -and -not (Get-Command ffmpeg -ErrorAction SilentlyContinue); $i++) {
            if ($i -gt 1) { Start-Sleep -Seconds (20 * ($i - 1)) }
            choco install ffmpeg -y --no-progress
            $env:Path = [Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' + [Environment]::GetEnvironmentVariable('Path', 'User')
          }
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) { throw "ffmpeg still missing after 3 chocolatey tries" }
      # Every check lives in scripts/ci-local.ps1. Both machines have a desktop
      # (our VM logs in by itself; windows-latest presents a virtual display), so
      # the desktop steps (live smoke, GUI smoke, end-to-end connect) run on both.
      - name: Windows checks
        shell: pwsh
        run: pwsh -File scripts/ci-local.ps1
