name: Windows CI
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      # ffmpeg isn't preinstalled on windows-latest; chocolatey is. The two
      # clip steps in the script call ffmpeg from PATH (chocolatey's shim
      # folder is already on it).
      - name: Install ffmpeg
        run: choco install ffmpeg -y --no-progress
      # Every check lives in scripts/ci-local.ps1, which the local CI also
      # runs. windows-latest presents a virtual display, so the desktop steps
      # (live smoke, GUI smoke, end-to-end connect) run here too.
      - name: Windows checks
        shell: pwsh
        run: pwsh -File scripts/ci-local.ps1
