name: Windows CI
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build Windows host server
        run: dotnet build WindowsServer/ClamshellServer.csproj -c Release
      - name: Self-test (pure protocol/framing logic)
        run: dotnet run --project WindowsServer/ClamshellServer.csproj -c Release -- selftest
      - name: Input self-test (shared vectors, tests/vectors/input-v1.json)
        run: dotnet run --project WindowsServer/ClamshellServer.csproj -c Release -- selftest-input tests/vectors/input-v1.json

      - name: Encoder self-test (the session's encoder path, synthetic frames, real AVCC out)
        run: dotnet run --project WindowsServer/ClamshellServer.csproj -c Release -- selftest-encoder

      - name: Host key self-test (real Windows key store, throwaway key)
        if: ${{ !cancelled() }}
        run: dotnet run --project WindowsServer/ClamshellServer.csproj -c Release -- selftest-hostkey

      - name: Device list self-test (real DPAPI and file system, throwaway folder)
        if: ${{ !cancelled() }}
        run: dotnet run --project WindowsServer/ClamshellServer.csproj -c Release -- selftest-store

      - name: Gate self-test (real server on loopback, real handshakes, throwaway key and list)
        if: ${{ !cancelled() }}
        run: dotnet run --project WindowsServer/ClamshellServer.csproj -c Release -- selftest-gate

      - name: Device commands self-test (devices, approve, deny, revoke, forget against a throwaway list)
        if: ${{ !cancelled() }}
        run: dotnet run --project WindowsServer/ClamshellServer.csproj -c Release -- selftest-commands

      - name: Host screens self-test (approval window, Devices section, Settings built once, no network)
        if: ${{ !cancelled() }}
        run: dotnet run --project WindowsServer/ClamshellServer.csproj -c Release -- selftest-screens

      - name: Live smoke test (real display enum, encoder probe, listener bind)
        if: ${{ !cancelled() }}
        # `selftest` above never touches DXGI/Media Foundation/HttpListener —
        # those need an actual display/session, which is exactly what nobody
        # had verified on Windows at all (see README). windows-latest runners
        # do present a virtual display, so this launches the real server for
        # a few seconds and checks it made it through display enumeration,
        # the hardware-encoder probe, and a listener bind without an
        # unhandled exception, then kills it. Not a substitute for testing
        # with a real client connection, but it is real capture/encode code
        # actually running, not just protocol framing in isolation.
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath dotnet `
            -ArgumentList "run","--project","WindowsServer/ClamshellServer.csproj","-c","Release","--","5950" `
            -NoNewWindow -PassThru `
            -RedirectStandardOutput smoke-out.log -RedirectStandardError smoke-err.log
          Start-Sleep -Seconds 10

          if ($proc.HasExited) {
            Write-Output "--- stdout ---"; Get-Content smoke-out.log -ErrorAction SilentlyContinue
            Write-Output "--- stderr ---"; Get-Content smoke-err.log -ErrorAction SilentlyContinue
            throw "ClamshellServer exited early (code $($proc.ExitCode)) instead of staying up"
          }
          Stop-Process -Id $proc.Id -Force

          # Log.cs writes every startup line to stderr, not stdout.
          Write-Output "--- stdout ---"
          Get-Content smoke-out.log -ErrorAction SilentlyContinue
          Write-Output "--- stderr ---"
          Get-Content smoke-err.log -ErrorAction SilentlyContinue
          $log = Get-Content smoke-err.log -Raw -ErrorAction SilentlyContinue
          if ($log -notmatch "display\(s\)") { throw "startup log missing display enumeration line" }
          if ($log -notmatch "hardware video encoder|no hardware video encoder") { throw "startup log missing encoder probe line" }
          if ($log -notmatch "listening on ws port|cannot bind") { throw "startup log missing listener bind line" }
          Write-Output "smoke test OK: process stayed up and completed the real startup sequence"

      - name: Build Windows viewer client
        if: ${{ !cancelled() }}
        run: dotnet build WindowsViewer/ClamshellWindowViewer.csproj -c Release
      - name: Viewer self-test (pure protocol/AVCC-AnnexB framing logic)
        if: ${{ !cancelled() }}
        run: dotnet run --project WindowsViewer/ClamshellWindowViewer.csproj -c Release -- selftest
      - name: Viewer device-auth self-test (vectors, handshakes, tampered frames)
        if: ${{ !cancelled() }}
        run: dotnet run --project WindowsViewer/ClamshellWindowViewer.csproj -c Release -- selftest-auth tests/vectors/auth-v1.json
      - name: Viewer key store self-test (real Windows key store, throwaway key)
        if: ${{ !cancelled() }}
        run: dotnet run --project WindowsViewer/ClamshellWindowViewer.csproj -c Release -- selftest-keystore

      - name: Viewer screens self-test (each device-auth screen built once, no network)
        if: ${{ !cancelled() }}
        run: dotnet run --project WindowsViewer/ClamshellWindowViewer.csproj -c Release -- selftest-screens
      - name: Viewer saved-Macs commands (known-hosts, forget-host with nothing saved)
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          dotnet run --project WindowsViewer/ClamshellWindowViewer.csproj -c Release -- known-hosts
          if ($LASTEXITCODE -ne 0) { throw "known-hosts failed (exit $LASTEXITCODE)" }
          dotnet run --project WindowsViewer/ClamshellWindowViewer.csproj -c Release -- forget-host nothing-here
          if ($LASTEXITCODE -ne 1) { throw "forget-host of an unknown Mac should exit 1, got $LASTEXITCODE" }
          # The exit code 1 above was the expected one; do not let it fail the step.
          exit 0

      - name: Viewer GUI smoke test (real WPF Application/Window on a real virtual display)
        # The `--verify`/`decode-file` steps below never construct MainWindow
        # -- they're deliberately headless (no Dispatcher) so they run
        # unattended. That leaves the actual GUI path (System.Windows.
        # Application, code-only Window/Image/WriteableBitmap init, no
        # App.xaml) completely unexercised. windows-latest presents a real
        # virtual display (same fact the host's smoke test above relies on),
        # so launch the real GUI mode (no server needed -- Start() catches a
        # failed connect and just updates the title, the window still comes
        # up) and confirm the process stays alive for a few seconds instead
        # of crashing on startup.
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath dotnet `
            -ArgumentList "run","--project","WindowsViewer/ClamshellWindowViewer.csproj","-c","Release","--","127.0.0.1","1" `
            -NoNewWindow -PassThru `
            -RedirectStandardOutput viewer-gui-out.log -RedirectStandardError viewer-gui-err.log
          Start-Sleep -Seconds 5

          Write-Output "--- viewer GUI stdout ---"; Get-Content viewer-gui-out.log -ErrorAction SilentlyContinue
          Write-Output "--- viewer GUI stderr ---"; Get-Content viewer-gui-err.log -ErrorAction SilentlyContinue

          if ($proc.HasExited) { throw "viewer GUI process exited early (code $($proc.ExitCode)) instead of staying up" }
          Stop-Process -Id $proc.Id -Force
          Write-Output "viewer GUI smoke test OK: WPF Application/Window constructed and stayed up on a real virtual display"

      - name: End-to-end viewer connect (real host HELLO/HELLO_ACK -> real client)
        if: ${{ !cancelled() }}
        # The host now asks before it lets a new device in, and this step no
        # longer passes --allow-unverified: the viewer connects as an unknown
        # device and waits; this script approves it through the host's own
        # command line (`ClamshellServer approve <fingerprint>`, against a
        # throwaway state folder), and only then does the session start. What
        # this step proves is that handshake and approval, and then that the
        # host's own encoder produced a frame the viewer decoded (`verify: PASS`).
        #
        # Both the proven host (above) and the new viewer run in this same
        # job, so this drives the real wire handshake on real Windows.
        # ClamshellServer.exe is launched as a real display-stream source
        # (Notepad opened first for real on-screen content); the viewer's
        # headless `--verify` mode (no WPF window/Dispatcher, so it runs
        # cleanly unattended) does a real WebSocket connect and a real
        # HELLO/HELLO_ACK round trip.
        #
        # Scope note: this is a *display* stream, not a *window* stream --
        # WindowsServer has no
        # window-capture/streaming implementation yet (WindowEnum.cs is
        # enumeration only, PROTOCOL.md "Window Handoff v2, PROPOSED").
        shell: pwsh
        run: |
          # A throwaway device list for this step: the host and the command
          # line below both read it from here.
          $env:CLAMSHELL_STATE_DIR = Join-Path $PWD "e2e-state"
          $notepad = Start-Process notepad.exe -PassThru
          Start-Sleep -Seconds 2

          $server = Start-Process -FilePath dotnet `
            -ArgumentList "run","--project","WindowsServer/ClamshellServer.csproj","-c","Release","--","5951" `
            -NoNewWindow -PassThru `
            -RedirectStandardOutput server-out.log -RedirectStandardError server-err.log
          Start-Sleep -Seconds 8

          if ($server.HasExited) {
            Write-Output "--- server stderr ---"; Get-Content server-err.log -ErrorAction SilentlyContinue
            throw "ClamshellServer exited early instead of staying up for the viewer test"
          }

          # No --allow-unverified. The viewer connects as a device the host has
          # never seen and waits to be approved.
          $viewer = Start-Process -FilePath dotnet `
            -ArgumentList "run","--project","WindowsViewer/ClamshellWindowViewer.csproj","-c","Release","--","--verify","127.0.0.1","5951","h264","60" `
            -NoNewWindow -PassThru `
            -RedirectStandardOutput viewer-out.log -RedirectStandardError viewer-err.log
          $null = $viewer.Handle   # keeps the exit code readable after it exits

          # Find the waiting device the way a person at the PC would, then approve it.
          # The program has no console of its own here, so it writes its answer to this file.
          $env:CLAMSHELL_CLI_OUTPUT = Join-Path $PWD "cli-out.txt"
          $cli = @("run","--no-build","--project","WindowsServer/ClamshellServer.csproj","-c","Release","--")
          $fingerprint = $null
          $listing = ""
          for ($i = 0; $i -lt 40 -and -not $fingerprint; $i++) {
            & dotnet @cli devices 2>&1 | Out-Null
            $listing = if (Test-Path cli-out.txt) { Get-Content cli-out.txt -Raw } else { "" }
            if ($listing -match "Waiting for approval:\s+([0-9A-F]{4}(?:-[0-9A-F]{4}){3})") { $fingerprint = $Matches[1] }
            else { Start-Sleep -Seconds 1 }
          }
          Write-Output "--- host device list ---"; Write-Output $listing
          $approveOut = $null
          $approveCode = $null
          if ($fingerprint) {
            & dotnet @cli approve $fingerprint 2>&1 | Out-Null
            $approveCode = $LASTEXITCODE
            $approveOut = if (Test-Path cli-out.txt) { Get-Content cli-out.txt -Raw } else { "" }
            Write-Output "--- approve $fingerprint (exit $approveCode) ---"; Write-Output $approveOut
          }

          if (-not $viewer.WaitForExit(70000)) { Stop-Process -Id $viewer.Id -Force -ErrorAction SilentlyContinue }

          Write-Output "--- server stderr ---"; Get-Content server-err.log -ErrorAction SilentlyContinue
          Write-Output "--- viewer stderr ---"; Get-Content viewer-err.log -ErrorAction SilentlyContinue

          Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
          Stop-Process -Id $notepad.Id -Force -ErrorAction SilentlyContinue

          if (-not $fingerprint) { throw "the host never listed a device waiting for approval: the viewer did not reach the gate" }
          if ($approveCode -ne 0) { throw "approving the waiting device from the command line failed (exit $approveCode)" }
          $vlog = Get-Content viewer-err.log -Raw -ErrorAction SilentlyContinue
          if (-not $vlog) { $vlog = "" }
          # The steps have to happen in this order: told to wait, then let in, then
          # HELLO_ACK, then a decoded frame.
          $waiting = $vlog.IndexOf("verify: state WaitingForApproval", [StringComparison]::Ordinal)
          $connected = $vlog.IndexOf("verify: state Connected", [StringComparison]::Ordinal)
          $helloAck = $vlog.IndexOf("verify: HELLO_ACK", [StringComparison]::Ordinal)
          $pass = $vlog.IndexOf("verify: PASS", [StringComparison]::Ordinal)
          if ($waiting -lt 0) { throw "the viewer was never told it was waiting for approval" }
          if ($connected -lt 0) { throw "the viewer was not connected after the device was approved" }
          if ($helloAck -lt 0) { throw "viewer never received HELLO_ACK after approval -- real connectivity failure" }
          if (-not ($waiting -lt $connected -and $connected -lt $helloAck)) { throw "the viewer's states were out of order (waiting $waiting, connected $connected, HELLO_ACK $helloAck)" }
          Write-Output "handshake and approval checked: the device waited, was approved on the host from the command line, was let in, and received HELLO_ACK"
          if ($pass -lt 0) { throw "no decoded video: the viewer did not print 'verify: PASS', so no VIDEO_FRAME from the real host was decoded" }
          if ($pass -lt $helloAck) { throw "'verify: PASS' appeared before HELLO_ACK (PASS $pass, HELLO_ACK $helloAck)" }
          Write-Output "video checked: a real VIDEO_FRAME from the host's own encoder was decoded by the viewer over the encrypted session"

      - name: Generate a real single-frame H.264 test clip (ffmpeg, independent of WindowsServer)
        if: ${{ !cancelled() }}
        # ffmpeg isn't preinstalled on windows-latest -- chocolatey is, so
        # install it from there. A single-keyframe clip (-frames:v 1) is
        # exactly one access unit (SPS+PPS+IDR, Annex-B start-code
        # delimited) so the viewer can feed the whole file as one sample --
        # see VideoDecoder.FeedAnnexB / Program.cs decode-file.
        shell: pwsh
        run: |
          choco install ffmpeg -y --no-progress
          # choco updates the machine PATH, but this script block is still
          # the same process it started in -- call the shim chocolatey just
          # installed directly rather than relying on a refreshed PATH.
          $ffmpeg = "C:\ProgramData\chocolatey\bin\ffmpeg.exe"
          & $ffmpeg -y -f lavfi -i "testsrc=size=320x240:rate=1" -frames:v 1 -c:v libx264 -pix_fmt yuv420p -f h264 test-frame.h264
          if (-not (Test-Path test-frame.h264) -or (Get-Item test-frame.h264).Length -eq 0) { throw "ffmpeg did not produce test-frame.h264" }
          Write-Output "generated test-frame.h264: $((Get-Item test-frame.h264).Length) bytes"

      - name: Viewer decode-file (real H.264 -> real Media Foundation decode)
        if: ${{ !cancelled() }}
        # Proves the viewer's own decode pipeline (VideoDecoder.cs, a real
        # Media Foundation H.264 decoder MFT -- software path, since this
        # runner has no GPU) against a real H.264 stream from an
        # independent, known-good encoder (ffmpeg/libx264), sidestepping
        # the WindowsServer encoder gap noted above entirely. PASS requires
        # an actual decoded frame with non-uniform pixel content (the
        # ffmpeg testsrc pattern is not a flat color), not just "it didn't
        # throw".
        shell: pwsh
        run: |
          dotnet run --project WindowsViewer/ClamshellWindowViewer.csproj -c Release -- decode-file test-frame.h264 h264 `
            2> decode-file-err.log
          $code = $LASTEXITCODE
          Write-Output "--- decode-file stderr ---"; Get-Content decode-file-err.log -ErrorAction SilentlyContinue
          if ($code -ne 0) { throw "decode-file FAILED (exit $code) -- see stderr above" }
          $dlog = Get-Content decode-file-err.log -Raw -ErrorAction SilentlyContinue
          if ($dlog -notmatch "decode-file: PASS") { throw "decode-file stderr missing 'decode-file: PASS' line" }
          Write-Output "decode-file OK: real ffmpeg-produced H.264 decoded through a real Media Foundation decoder MFT"

      - name: Generate a one-second 1 kHz stereo AAC-LC clip (ffmpeg, ADTS)
        if: ${{ !cancelled() }}
        # Same idea as the H.264 clip above: an independent encoder makes the
        # input, so the viewer's decoder is checked against a known-good stream.
        # The H.264 step normally installed ffmpeg already; install it here too
        # if that step did not run.
        shell: pwsh
        run: |
          $ffmpeg = "C:\ProgramData\chocolatey\bin\ffmpeg.exe"
          if (-not (Test-Path $ffmpeg)) { choco install ffmpeg -y --no-progress }
          & $ffmpeg -y -f lavfi -i "sine=frequency=1000:duration=1:sample_rate=48000" -ac 2 -c:a aac -profile:a aac_low -b:a 128k -f adts test-tone.aac
          if (-not (Test-Path test-tone.aac) -or (Get-Item test-tone.aac).Length -eq 0) { throw "ffmpeg did not produce test-tone.aac" }
          Write-Output "generated test-tone.aac: $((Get-Item test-tone.aac).Length) bytes"

      - name: Viewer decode-audio-file (real AAC-LC -> real Media Foundation decode)
        if: ${{ !cancelled() }}
        # Feeds the raw access units of the clip (ADTS headers dropped) through
        # the same AudioDecoder a live session uses, then checks the PCM: 48 kHz
        # stereo, the length within one frame of 1024, and a 1 kHz tone in both
        # channels. This proves the decoder. It plays nothing: this runner has no
        # speakers and CI cannot hear.
        shell: pwsh
        run: |
          dotnet run --project WindowsViewer/ClamshellWindowViewer.csproj -c Release -- decode-audio-file test-tone.aac 1000 1 `
            2> decode-audio-err.log
          $code = $LASTEXITCODE
          Write-Output "--- decode-audio-file stderr ---"; Get-Content decode-audio-err.log -ErrorAction SilentlyContinue
          if ($code -ne 0) { throw "decode-audio-file FAILED (exit $code) -- see stderr above" }
          $alog = Get-Content decode-audio-err.log -Raw -ErrorAction SilentlyContinue
          if ($alog -notmatch "decode-audio-file: PASS") { throw "decode-audio-file stderr missing 'decode-audio-file: PASS' line" }
          Write-Output "decode-audio-file OK: a real ffmpeg AAC-LC clip decoded through a real Media Foundation decoder MFT to a 1 kHz tone. Sound output itself was NOT checked."
