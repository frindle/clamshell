name: DeskProtocol
on:
  push:
    branches: [main]
    paths: ['DeskProtocol/**', 'PROTOCOL.md', 'Sources/Clamshell/Streaming/StreamProtocol.swift', '.github/workflows/desk-protocol.yml']
  pull_request:
    paths: ['DeskProtocol/**', 'PROTOCOL.md', 'Sources/Clamshell/Streaming/StreamProtocol.swift', '.github/workflows/desk-protocol.yml']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Pure logic, no Apple frameworks: runs on Linux, off the macOS runners.
  linux:
    name: DeskProtocol (Linux)
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - name: Test
        working-directory: DeskProtocol
        env:
          DESK_REQUIRE_REPO: '1'
        run: swift test
  # Same package on the Apple toolchain, so a stdlib difference cannot hide.
  macos:
    name: DeskProtocol (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test
        working-directory: DeskProtocol
        env:
          DESK_REQUIRE_REPO: '1'
        run: swift test
