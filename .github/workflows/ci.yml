name: CI
on:
  push:
    branches: [main]
  pull_request:

# Pushes to main queue behind each other; a new push to a pull request
# replaces its still-running older run. GitHub-hosted macOS jobs wait for a
# free runner rather than fail. ci-auto-retry.yml re-runs infrastructure failures.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: macOS build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Unit tests
        run: swift test
      - name: Smoke test (detection)
        run: .build/debug/Clamshell test-detect
      - name: Self-tests (headless)
        run: |
          .build/debug/Clamshell stream-selftest
          .build/debug/Clamshell hello-collapse-selftest
          .build/debug/Clamshell encoder-resize-selftest
          .build/debug/Clamshell self-heal-guard-selftest
          .build/debug/Clamshell confirmation-bridge-selftest
          .build/debug/Clamshell confirmation-coordinator-selftest
          .build/debug/Clamshell auth-gate-selftest
          # macOS asks before a program may use the local network, and nobody
          # can answer on a runner. The selftest exits 75 when it was not
          # allowed to announce at all. Root is not asked, so it then runs
          # again as root. Any other failure, or a second 75, fails the step.
          .build/debug/Clamshell discovery-selftest || {
            code=$?
            [ "$code" -eq 75 ] || exit "$code"
            echo "Not allowed to announce as the runner user; running the discovery selftest as root."
            sudo .build/debug/Clamshell discovery-selftest
          }
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      # Web client tests and syntax check, login-window script and plist
      # lint: all in scripts/ci-local.sh, which the local CI also runs.
      - name: Node, Python and bash checks
        run: bash scripts/ci-local.sh
      # The interop check needs a global WebSocket, which Node 20 does not have
      # without a flag. It runs the web client's auth.js against the real host
      # (`Clamshell auth-interop-host`, loopback only, temporary state directory).
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Web client auth against the real host
        timeout-minutes: 3
        run: node tests/test-webclient-auth-interop.js .build/debug/Clamshell 5994
      # The same host set-up, driven by the C# client flow that the Windows
      # viewer uses (WindowsShared/), over a plain ClientWebSocket.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Windows viewer client flow against the real host
        timeout-minutes: 5
        run: dotnet run --project tests/WindowsViewerInterop/WindowsViewerInterop.csproj -c Release -- "$PWD/.build/debug/Clamshell" 5995
      - name: Pre-login input section is in the binary
        run: |
          # WindowServer drops input from binaries without an (empty)
          # __CGPreLoginApp,__cgpreloginapp section before anyone is logged in.
          otool -l .build/debug/Clamshell | grep -q "sectname __cgpreloginapp"
          otool -l .build/debug/Clamshell | grep -q "segname __CGPreLoginApp"
      - name: Login-window agent stays off when a user is logged in
        run: |
          # In a logged-in session (the CI runner is one) the agent must exit
          # at once and open no port. The alarm fails the step if it serves.
          perl -e 'alarm 20; exec @ARGV' .build/debug/Clamshell loginwindow-agent > /tmp/agent.out
          cat /tmp/agent.out
          grep -q "nothing to do" /tmp/agent.out
      - name: Package (release build, ad-hoc signed DMG)
        run: ./package.sh 0.0.0
      - name: Login-window agent plists are shipped in the app
        run: |
          test -d dist/Clamshell.app
          dir=dist/Clamshell.app/Contents/Resources/loginwindow-agent
          for label in loginwindow-agent loginwindow-sync; do
            plutil -lint "$dir/com.frindle.clamshell.$label.plist"
          done
      - name: Login-window install command refuses without root
        run: |
          set +e
          dist/Clamshell.app/Contents/MacOS/Clamshell loginwindow install > /tmp/lw.out
          code=$?
          cat /tmp/lw.out
          [ "$code" -eq 1 ] && grep -q "Run with sudo" /tmp/lw.out
      - name: Pre-login input section survives packaging and signing
        run: |
          # The universal release build, after codesign, must still carry it.
          otool -l dist/Clamshell.app/Contents/MacOS/Clamshell | grep -q "sectname __cgpreloginapp"
      - name: Login launch agent is in the app bundle
        run: |
          f=dist/Clamshell.app/Contents/Library/LaunchAgents/com.frindle.clamshell.agent.plist
          test -f "$f"
          plutil -lint "$f"
          test "$(/usr/libexec/PlistBuddy -c 'Print :Label' "$f")" = "com.frindle.clamshell.agent"
          test "$(/usr/libexec/PlistBuddy -c 'Print :BundleProgram' "$f")" = "Contents/MacOS/Clamshell"
          test "$(/usr/libexec/PlistBuddy -c 'Print :KeepAlive:SuccessfulExit' "$f")" = "false"
          # Still intact after signing.
          codesign --verify --deep --strict dist/Clamshell.app
      - name: Build iOS app (universal iPad+iPhone, simulator, compile check only)
        run: |
          cd ClamshellViewer
          # -scheme, not -project/-target: ClamshellViewer depends on the local
          # FreeRDPKit SPM package, and only scheme builds resolve/build SPM
          # package products before compiling — a bare -target build fails with
          # "module map file ... RDPBridge.modulemap not found" because nothing
          # triggers the package build first.
          # EXCLUDED_ARCHS=x86_64: FreeRDPKit's vendored CFreeRDP.xcframework
          # is arm64-only (build-freerdp-ios.sh doesn't cross-compile an x86_64
          # slice), so a default multi-arch simulator build fails linking it.
          xcodebuild -scheme ClamshellViewer \
            -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO EXCLUDED_ARCHS=x86_64 build
