name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Smoke test (detection)
        run: .build/debug/Clamshell test-detect
      - name: Package (release build, ad-hoc signed DMG)
        run: ./package.sh 0.0.0
      - name: Build iOS viewer (simulator, compile check only)
        run: |
          cd ClamshellViewer
          # -scheme, not -project/-target: ClamshellViewer depends on the local
          # FreeRDPKit SPM package, and only scheme builds resolve/build SPM
          # package products before compiling — a bare -target build fails with
          # "module map file ... RDPBridge.modulemap not found" because nothing
          # triggers the package build first.
          # EXCLUDED_ARCHS=x86_64: FreeRDPKit's vendored CFreeRDP.xcframework
          # is arm64-only (build-freerdp-ios.sh doesn't cross-compile an x86_64
          # slice), so a default multi-arch simulator build fails linking it.
          xcodebuild -scheme ClamshellViewer \
            -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO EXCLUDED_ARCHS=x86_64 build
      - name: Build iPhone control app (simulator, compile check only)
        run: |
          cd ClamshellViewer
          xcodebuild -scheme ClamshellControl \
            -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO build
