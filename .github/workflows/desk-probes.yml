name: DeskProbes
on:
  push:
    branches: [main]
    paths: ['DeskProbes/**', '.github/workflows/desk-probes.yml', '.github/actions/import-signing-cert/**']
  pull_request:
    paths: ['DeskProbes/**', '.github/workflows/desk-probes.yml', '.github/actions/import-signing-cert/**']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e7:
    name: E7 probe (build, sign, smoke run)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/import-signing-cert
        with:
          p12: ${{ secrets.CLAMSHELL_CERT_P12 }}
          password: ${{ secrets.CLAMSHELL_CERT_PASSWORD }}
      - name: Build
        env:
          SIGN_ID: Clamshell Dev
        run: DeskProbes/E7/build.sh "$RUNNER_TEMP/e7"
      # The grants follow the designated requirement: it must name the certificate, not a build hash.
      - name: Check the signature keeps grants across builds
        run: |
          APP="$RUNNER_TEMP/e7/NotifProbe.app"
          codesign -dvv "$APP" 2>&1 | grep -q '^Authority=Clamshell Dev$'
          codesign -dr - "$APP" 2>&1 | grep -q 'identifier "com.frindle.desk.e7probe" and certificate leaf = H"'
          echo "signed with Clamshell Dev; requirement is identifier + certificate"
      # No Full Disk Access or Accessibility on the runner: it must start, report both as missing, and exit on time.
      - name: Smoke run
        run: |
          rm -f ~/Library/Logs/NotifProbe/probe.log
          # macOS has no timeout(1); perl alarm kills it if it hangs.
          perl -e 'alarm 30; exec @ARGV' "$RUNNER_TEMP/e7/NotifProbe.app/Contents/MacOS/NotifProbe" 3
          cat ~/Library/Logs/NotifProbe/probe.log
          grep -q ' start: run 3s' ~/Library/Logs/NotifProbe/probe.log
          grep -q ' end: notifications=' ~/Library/Logs/NotifProbe/probe.log
      - name: Package
        run: cd "$RUNNER_TEMP/e7" && ditto -c -k --keepParent NotifProbe.app NotifProbe.zip
      - uses: actions/upload-artifact@v4
        with:
          name: NotifProbe
          path: ${{ runner.temp }}/e7/NotifProbe.zip
          retention-days: 14
