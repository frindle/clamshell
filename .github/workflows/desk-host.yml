name: DeskHost
on:
  push:
    branches: [main]
    paths: ['DeskHost/**', 'DeskProtocol/**', '.github/workflows/desk-host.yml']
  pull_request:
    paths: ['DeskHost/**', 'DeskProtocol/**', '.github/workflows/desk-host.yml']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Pure logic, no Apple frameworks: runs on Linux, off the macOS runners.
  linux:
    name: DeskHost (Linux)
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - name: Test
        working-directory: DeskHost
        run: swift test
  # Same package on the Apple toolchain, so a stdlib difference cannot hide.
  macos:
    name: DeskHost (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test
        working-directory: DeskHost
        run: swift test
